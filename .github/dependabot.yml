# Weekly dependency updates. Minor and patch bumps are grouped into one PR per ecosystem; majors stay separate.
# Dependabot alerts, security updates and CodeQL default setup are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
