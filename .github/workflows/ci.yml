# Runs the test suite on every PR. OpenApiSnapshotTest and ErrorCodesDocTest fail
# when docs/frontend/openapi.json or error-codes.md is stale, so a contract change
# cannot reach main (and the client sync) without its regenerated docs.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Testcontainers uses the runner's Docker daemon
      - run: ./mvnw -B test
