spring:
  application:
    name: vomatt-api
  profiles:
    active: ${PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Avatar upload limit; the request allows room for the multipart envelope
      max-file-size: 2MB
      max-request-size: 3MB
  autoconfigure:
    # Auth uses JWT, so the default in-memory user is not needed (faster startup, and no generated password in the log)
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # sslmode is set here, not left to DB_URL: require (default) encrypts; set DB_SSLMODE=verify-full where the server
    # certificate can be checked (plus sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory to use the JVM truststore),
    # and disable only for the local docker compose Postgres
    url: ${DB_URL}?reWriteBatchedInserts=true&prepareThreshold=0&sslmode=${DB_SSLMODE:require}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  flyway:
    # Migrations run at startup, so an unreachable database now fails startup (SPRING_FLYWAY_ENABLED=false skips them).
    # Databases created from the old schema.sql have no history table: baselined at the baseline migration's version,
    # then catch_up brings them up to date
    schemas: vomatt
    baseline-on-migrate: true
    baseline-version: "20261027125251"
    # Versions are creation timestamps, so a branch merged later can carry an older version than one already applied
    out-of-order: true

  jpa:
    # Do not read DB metadata at startup (serverless cold start: open the port even if the DB is slow or unreachable; errors surface at request time)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        default_schema: vomatt
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  data:
    web:
      pageable:
        # Matches PageResponse.page (1-based): the page request parameter also starts at 1
        one-indexed-parameters: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail fast: Redis guards correctness paths (OTP, refresh tokens, rate limits), so a hung call must not stall requests
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
        shutdown-timeout: 100ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Without SMTP timeouts, synchronous sending blocks the request thread until the OS socket times out
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 128

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    # 3.0 so @Schema(nullable = true) is emitted; 3.1 drops it and generated TS types lose `| null`
    version: openapi_3_0
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    syntax-highlight:
      activated: true
  default-produces-media-type: application/json

app:
  # Root secret: purpose-specific keys (OTP hashing...) are derived from it, see AppKey. At least 32 characters
  key: ${APP_KEY}
  openapi:
    dev-url: ${OPENAPI_DEV_URL:http://localhost:8080}
    prod-url: ${OPENAPI_PROD_URL:https://localhost:8080}
  email:
    enabled: ${EMAIL_ENABLED:false}
    # smtp (spring.mail.*) or resend (HTTP API, for hosts that block outbound SMTP)
    provider: ${EMAIL_PROVIDER:smtp}
    resend-api-key: ${RESEND_API_KEY:}
    # A display name ("Vomatt <...>") over a bare address: Gmail scores nameless senders lower
    from: "${EMAIL_FROM:Vomatt <noreply@vomatt.com>}"
    # Reply-To; leave blank until the address has a mailbox (vomatt.com has no MX record)
    reply-to: ${EMAIL_REPLY_TO:}
    # Frontend origin used for links in emails (logo, footer)
    site-url: ${EMAIL_SITE_URL:https://vomatt.com}
    # Frontend path of a Poll, appended to site-url in invitation emails; {voteId} is replaced
    poll-path: ${EMAIL_POLL_PATH:/poll/{voteId}}
    # Frontend sign-up page, appended to site-url in invitations for addresses with no account
    signup-path: ${EMAIL_SIGNUP_PATH:/login}
  security:
    # Comma-separated frontend origins; * is not allowed
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # Comma-separated CIDRs allowed to set X-Forwarded-For; blank uses ClientIpResolver.DEFAULT_TRUSTED_PROXIES
    trusted-proxies: ${TRUSTED_PROXIES:}
    # Shared with vomatt-web (same name there), which sends it in X-Client-IP-Secret with the user's IP in X-Client-IP.
    # At least 32 characters; blank ignores X-Client-IP, so every user behind vomatt-web shares its IP for rate limits
    client-ip-secret: ${CLIENT_IP_SECRET:}
  storage:
    # S3-compatible bucket for uploaded avatars (Railway Bucket; the s3 service in docker compose). Unset endpoint or bucket:
    # the app starts, avatar uploads answer 503 common.storage_unavailable
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:}
    access-key-id: ${STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${STORAGE_SECRET_ACCESS_KEY:}
    # true for the docker compose s3 service; virtual-hosted style (bucket.endpoint) otherwise
    path-style: ${STORAGE_PATH_STYLE:false}
  audit:
    enabled: ${AUDIT_ENABLED:true}
  billing:
    # Paid plans through Stripe; off until it is integrated (vomatt-web docs/release/stripe-go-live.md)
    enabled: ${BILLING_ENABLED:false}
  retention:
    # Daily data retention run (RetentionJob), UTC; one instance does the work, the others skip via advisory lock
    cron: ${RETENTION_CRON:0 30 4 * * *}
  community:
    # CommunitySelectionJob, UTC: gives owners over their community limit a selection deadline, then locks the
    # accounts of those who let it pass; runs on every instance, each user under their own row lock
    selection-cron: ${COMMUNITY_SELECTION_CRON:0 */10 * * * *}

otp:
  ttl-seconds: ${OTP_TTL_SECONDS:180}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:180}
  # OTPs one identifier may be sent per UTC day; SMS costs money, so phone is tighter
  daily-limit:
    email: ${OTP_DAILY_LIMIT_EMAIL:20}
    phone: ${OTP_DAILY_LIMIT_PHONE:5}

passkey:
  # WebAuthn RP ID: the domain web, admin.vomatt.com and the iOS app all sign in under; never the API host. A local
  # https://vomatt.test page needs PASSKEY_RP_ID=vomatt.test (a browser only accepts the page's domain or a parent of it)
  rp-id: ${PASSKEY_RP_ID:vomatt.com}
  # Comma-separated origins accepted in a passkey's clientDataJSON; add https://vomatt.test for local development only
  allowed-origins: ${PASSKEY_ALLOWED_ORIGINS:https://vomatt.com,https://admin.vomatt.com}
  # Comma-separated origins the admin console passkey sign-in accepts; the RP ID is shared, so a consumer-origin
  # assertion must not sign in to the admin console. Add https://admin.vomatt.test for local development only
  admin-origins: ${PASSKEY_ADMIN_ORIGINS:https://admin.vomatt.com}

jwt:
  # Comma-separated: the first key signs, every key verifies (see JwtUtil for the rotation steps)
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  # Rotating the same oldToken again within N seconds returns the same pair, so cross-instance races and retries after a lost response are not flagged as reuse
  refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:60}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

line:
  channel-id: ${LINE_CHANNEL_ID:}
  channel-secret: ${LINE_CHANNEL_SECRET:}

apple:
  client-id: ${APPLE_CLIENT_ID:}

logging:
  level:
    com.vomatt: ${LOG_LEVEL:INFO}

rate-limit:
  enabled: true
  limit:
    capacity: 300
    window-seconds: 60
  paths:
    - /api/auth/**
    # writes only (GET/HEAD/OPTIONS skipped outside /api/auth); separate per-IP bucket from auth
    - /api/votes/**
    - /api/users/**
    - /api/feedback/**
    - /api/contact/**
