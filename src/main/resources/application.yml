spring:
  application:
    name: vomatt-api
  profiles:
    active: ${PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # Auth uses JWT, so the default in-memory user is not needed (faster startup, and no generated password in the log)
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}?reWriteBatchedInserts=true&prepareThreshold=0
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    # Do not read DB metadata at startup (serverless cold start: open the port even if the DB is slow or unreachable; errors surface at request time)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        default_schema: vomatt
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  data:
    web:
      pageable:
        # Matches PageResponse.page (1-based): the page request parameter also starts at 1
        one-indexed-parameters: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail fast: Redis guards correctness paths (OTP, refresh tokens, rate limits), so a hung call must not stall requests
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
        shutdown-timeout: 100ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Without SMTP timeouts, synchronous sending blocks the request thread until the OS socket times out
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 128

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    # 3.0 so @Schema(nullable = true) is emitted; 3.1 drops it and generated TS types lose `| null`
    version: openapi_3_0
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    syntax-highlight:
      activated: true
  default-produces-media-type: application/json

app:
  openapi:
    dev-url: ${OPENAPI_DEV_URL:http://localhost:8080}
    prod-url: ${OPENAPI_PROD_URL:https://localhost:8080}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:noreply@vomatt.com}
    # Frontend origin used for links in emails (logo, footer)
    site-url: ${EMAIL_SITE_URL:https://vomatt.com}
    # Frontend path of a Poll, appended to site-url in invitation emails; {voteId} is replaced
    poll-path: ${EMAIL_POLL_PATH:/poll/{voteId}}
    # Invitation emails one owner may trigger per UTC day; over it the Invitees are still added, only the email is skipped
    invitation-daily-limit: ${EMAIL_INVITATION_DAILY_LIMIT:200}
  security:
    # Comma-separated; * is not allowed when allowCredentials=true
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # Comma-separated CIDRs allowed to set X-Forwarded-For; blank uses ClientIpResolver.DEFAULT_TRUSTED_PROXIES
    trusted-proxies: ${TRUSTED_PROXIES:}
  vote:
    max-options-per-vote: ${VOTE_MAX_OPTIONS:10}
    min-options-per-vote: ${VOTE_MIN_OPTIONS:2}
    default-vote-duration: ${VOTE_DEFAULT_DURATION:P7D}
    max-vote-duration: ${VOTE_MAX_DURATION:P365D}
    delete-window: ${VOTE_DELETE_WINDOW:PT20M}
    allow-anonymous-voting: ${VOTE_ALLOW_ANONYMOUS:true}
    allow-multiple-choices-by-default: ${VOTE_ALLOW_MULTIPLE_DEFAULT:false}
    ballot-rate-limit:
      capacity: ${VOTE_BALLOT_RATE_LIMIT_CAPACITY:30}
      window: ${VOTE_BALLOT_RATE_LIMIT_WINDOW:PT60S}
  audit:
    enabled: ${AUDIT_ENABLED:true}

otp:
  ttl-seconds: ${OTP_TTL_SECONDS:180}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:180}

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  # Rotating the same oldToken again within N seconds returns the same pair, so cross-instance races are not flagged as reuse
  refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:10}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

line:
  channel-id: ${LINE_CHANNEL_ID:}
  channel-secret: ${LINE_CHANNEL_SECRET:}

apple:
  client-id: ${APPLE_CLIENT_ID:}

oauth:
  google:
    jwks-url: ${GOOGLE_JWKS_URL:https://www.googleapis.com/oauth2/v3/certs}
  line:
    token-url: ${LINE_TOKEN_URL:https://api.line.me/oauth2/v2.1/token}
    verify-url: ${LINE_VERIFY_URL:https://api.line.me/oauth2/v2.1/verify}
    profile-url: ${LINE_PROFILE_URL:https://api.line.me/v2/profile}
  apple:
    jwks-url: ${APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}

logging:
  level:
    com.vomatt: ${LOG_LEVEL:INFO}

rate-limit:
  enabled: true
  limit:
    capacity: 300
    window-seconds: 60
  paths:
    - /api/auth/**
    # writes only (GET/HEAD/OPTIONS skipped outside /api/auth); separate per-IP bucket from auth
    - /api/votes/**
    - /api/users/**
