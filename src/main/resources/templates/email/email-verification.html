<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子郵件驗證</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f9f9f9;
            border-radius: 5px;
            padding: 20px;
            border: 1px solid #ddd;
        }
        .header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .verification-code {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            background-color: #f0f8ff;
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 20px;
            margin: 30px 0;
            letter-spacing: 5px;
            color: #007bff;
            font-family: 'Courier New', monospace;
        }
        .footer {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>電子郵件驗證</h1>
        </div>
        
        <p>您好，</p>
        
        <p>感謝您註冊Vomatt帳戶。請使用以下驗證碼完成您的電子郵件驗證：</p>
        
        <div class="verification-code" th:text="${verificationCode}">123456</div>
        
        <p>此驗證碼將在10分鐘後失效。</p>
        
        <p>如果您沒有請求此驗證碼，請忽略此郵件。</p>
        
        <p>謝謝，<br>Vomatt團隊</p>
        
        <div class="footer">
            <p>此郵件是自動發送的，請勿回復。</p>
            <p>&copy; 2024 Vomatt. 版權所有。</p>
        </div>
    </div>
</body>
</html>
