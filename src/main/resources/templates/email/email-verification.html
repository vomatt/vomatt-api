<!DOCTYPE html>
<!-- Styles are inline: several mail clients (Outlook, some webmail) drop <style> blocks -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{email.verification.title}">Email Verification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f9f9f9; border-radius: 5px; padding: 20px; border: 1px solid #ddd;">
        <div style="text-align: center; padding-bottom: 10px; border-bottom: 1px solid #ddd; margin-bottom: 20px;">
            <h1 th:text="#{email.verification.title}">Email Verification</h1>
        </div>

        <p th:text="#{email.verification.greeting}">Hello,</p>

        <p th:text="${isPreSignup} ? #{email.verification.pre.signup.message} : #{email.verification.login.message}">
            Verification message
        </p>

        <div style="font-size: 32px; font-weight: bold; text-align: center; background-color: #f0f8ff; border: 2px solid #007bff; border-radius: 8px; padding: 20px; margin: 30px 0; letter-spacing: 5px; color: #007bff; font-family: 'Courier New', monospace;"
             th:text="${verificationCode}">123456</div>

        <p th:text="#{email.verification.expiry(${expiryMinutes})}">This verification code will expire in 3 minutes.</p>

        <p th:text="#{email.verification.ignore}">If you did not request this verification code, please ignore this email.</p>

        <p th:utext="#{email.verification.signature}">Thank you,<br>Vomatt Team</p>

        <div style="font-size: 12px; color: #666; text-align: center; margin-top: 30px; padding-top: 10px; border-top: 1px solid #ddd;">
            <p th:text="#{email.verification.footer.auto}">This email is sent automatically, please do not reply.</p>
            <p th:text="#{email.verification.footer.copyright(${year})}">&copy; 2026 Vomatt. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
