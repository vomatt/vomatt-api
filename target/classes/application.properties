spring.application.name=vomatt-api
spring.profiles.active=${PROFILES_ACTIVE:dev}
server.port=8080

# 資料庫配置 - 恢復為PostgreSQL
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:1234/postgres}?reWriteBatchedInserts=true&prepareThreshold=0
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.default_schema=vomatt
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# 安全配置
app.jwt.secret=${JWT_SECRET:testtest}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:604800000}

# OpenAPI/Swagger 配置 (v3 / OpenAPI 3.0)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true
app.openapi.dev-url=${OPENAPI_DEV_URL:http://localhost:8080}
app.openapi.prod-url=${OPENAPI_PROD_URL:https://localhost:8080}

# Rate Limiting
resilience4j.ratelimiter.instances.login.limitForPeriod=${RATE_LIMIT_LOGIN:5}
resilience4j.ratelimiter.instances.login.limitRefreshPeriod=${RATE_LIMIT_PERIOD:1m}
resilience4j.ratelimiter.instances.login.timeoutDuration=0

# Logging
# 增加更詳細的安全日誌級別
logging.level.com.vomattapi=${LOG_LEVEL_HOME:DEBUG}

# Email 功能配置開關 (已啟用)
app.email.enabled=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test}
spring.mail.password=${MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis 配置
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:999}
spring.data.redis.password=${REDIS_PASSWORD:test}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1000}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
spring.data.redis.jedis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:50}
spring.data.redis.jedis.pool.max-idle=${REDIS_POOL_MAX_IDLE:20}
spring.data.redis.jedis.pool.min-idle=${REDIS_POOL_MIN_IDLE:5}
spring.data.redis.jedis.pool.max-wait=${REDIS_POOL_MAX_WAIT:1000}

# SMS 功能配置開關 (已停用)
app.sms.enabled=false
app.sms.account-sid=${SMS_ACCOUNT_SID:your-account-sid}
app.sms.auth-token=${SMS_AUTH_TOKEN:your-auth-token}
app.sms.phone-number=${SMS_PHONE_NUMBER:your-twilio-phone-number}

# OAuth2 功能配置開關 (已停用)
app.oauth2.enabled=false
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# Vote System Configuration
app.vote.max-options-per-vote=${VOTE_MAX_OPTIONS:10}
app.vote.min-options-per-vote=${VOTE_MIN_OPTIONS:2}
app.vote.default-vote-duration=${VOTE_DEFAULT_DURATION:P7D}
app.vote.max-vote-duration=${VOTE_MAX_DURATION:P365D}

app.vote.allow-anonymous-voting=${VOTE_ALLOW_ANONYMOUS:true}
app.vote.allow-multiple-choices-by-default=${VOTE_ALLOW_MULTIPLE_DEFAULT:false}

# Security Configuration
app.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:PT15M}
app.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:P30D}
app.security.rate-limit.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.rate-limit.lockout-duration=${LOCKOUT_DURATION:PT15M}
app.security.rate-limit.requests-per-minute=${REQUESTS_PER_MINUTE:60}

# Application Configuration  
app.name=${APP_NAME:Vomatt Api}
app.version=${APP_VERSION:1.0.0}
app.description=${APP_DESCRIPTION:Vomatt Api}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Audit Configuration
app.audit.enabled=${AUDIT_ENABLED:true}
app.audit.log-sensitive-data=${AUDIT_LOG_SENSITIVE:false}
