<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設您的密碼</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f9f9f9;
            border-radius: 5px;
            padding: 20px;
            border: 1px solid #ddd;
        }
        .header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .button {
            display: block;
            width: 200px;
            margin: 30px auto;
            padding: 10px 20px;
            background-color: #4285f4;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .footer {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>密碼重設請求</h1>
        </div>
        
        <p>您好，</p>
        
        <p>我們收到了重設您密碼的請求。請點擊下方按鈕重設密碼：</p>
        
        <a class="button" th:href="${resetLink}" target="_blank">重設密碼</a>
        
        <p>如果上面的按鈕無法點擊，請複製以下連結並貼到瀏覽器地址欄：</p>
        
        <p><a th:href="${resetLink}" th:text="${resetLink}" target="_blank">https://example.com/reset</a></p>
        
        <p>此連結將在60分鐘後失效。</p>
        
        <p>如果您沒有請求重設密碼，請忽略此郵件，您的帳戶將保持安全。</p>
        
        <p>謝謝，<br>Vomatt團隊</p>
        
        <div class="footer">
            <p>此郵件是自動發送的，請勿回復。</p>
            <p>&copy; 2024 Vomatt. 版權所有。</p>
        </div>
    </div>
</body>
</html>
